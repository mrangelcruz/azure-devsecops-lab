name: PR Security Check

on:
  pull_request:
    branches: [main]

jobs:
  security-gate:
    uses: ./.github/workflows/security-gate.yml
    with:
      scan-path: '.'
    secrets: inherit

  all-checks-passed:
    needs: [security-gate]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed"