name: Deploy Day 1 — Bicep Lab

on:
  push:
    branches: [main]
    paths: [labs/bicep-deep/**]
  workflow_dispatch:
    inputs:
      action:
        description: Action to run
        type: choice
        options: [deploy, destroy]
        default: deploy
      mode:
        description: Deployment mode
        type: choice
        options: [Incremental, Complete]
        default: Incremental

permissions:
  security-events: write
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.inputs.action == 'deploy'
    uses: ./.github/workflows/bicep-deploy.yml
    with:
      resource-group: lab2-bicep-rg
      template-file: labs/bicep-deep/main.bicep
      parameters: environment=dev
      scan-path: labs/bicep-deep/
      mode: ${{ github.event.inputs.mode || 'Incremental' }}
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

  destroy:
    if: github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: lab-deploy
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: az group delete --name lab2-bicep-rg --yes --no-wait
